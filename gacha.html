<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>そらいろ ガチャ</title>
<style>
:root{--ink:#23496e;--gold:#ffd86b;--pink:#ff9ec4;--sky:#6fc3ff;--wood:#c9a06a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#cfeaff 0%,#e8f5ff 45%,#fbfdff 100%) fixed;color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:hidden}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(130px,20vh,170px) 20px calc(24px + env(safe-area-inset-bottom));text-align:center;position:relative}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.08em;color:var(--ink);text-shadow:0 0 8px #fff,0 0 16px #fff,0 0 24px #fff}
.sub{font-size:13px;margin-bottom:14px;color:var(--ink);font-weight:600;text-shadow:0 0 6px #fff,0 0 10px #fff,0 0 16px #fff,0 0 22px #fff}
.stage{position:relative;width:100%;max-width:340px;min-height:330px;display:flex;align-items:center;justify-content:center}
.capsule{width:150px;height:190px;position:relative;transition:transform .2s}
.capsule .top,.capsule .bot{position:absolute;left:0;width:100%;height:50%;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .6s}
.capsule .top{top:0;border-radius:75px 75px 0 0;background:linear-gradient(160deg,#b4e4ff,#3f9be0)}
.capsule .bot{bottom:0;border-radius:0 0 75px 75px;background:linear-gradient(160deg,#ffffff,#cfe6fa)}
.capsule .shine{position:absolute;left:22px;top:18px;width:22px;height:60px;border-radius:12px;background:rgba(255,255,255,.55);transform:rotate(12deg)}
.shake{animation:shake .5s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.open .top{transform:translateY(-120px) rotate(-25deg);opacity:0}
.open .bot{transform:translateY(120px) rotate(20deg);opacity:0}
button.main{margin-top:22px;width:min(320px,86vw);padding:16px;border:0;border-radius:999px;font-size:18px;font-weight:700;color:#3a1d00;background:linear-gradient(180deg,#ffe9a3,var(--gold));box-shadow:0 6px 0 #c9a23a,0 12px 24px rgba(0,0,0,.35)}
button.main:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a23a}
button.main:disabled{opacity:.5}
.msg{margin-top:16px;font-size:14px;min-height:20px;opacity:.9}
.err{color:#d6336c;font-weight:700}
/* カード */
.card{width:min(300px,82vw);border-radius:20px;padding:12px;background:linear-gradient(160deg,#ffffff,#cfe8ff);color:#1d3b5c;transform:rotateY(90deg);opacity:0;transition:transform .7s,opacity .3s;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.card.show{transform:rotateY(0);opacity:1}
.card.gold{background:linear-gradient(160deg,#fff6c9,#ffd86b 45%,#f0a92c);box-shadow:0 0 40px rgba(255,216,107,.9),0 14px 40px rgba(0,0,0,.5)}
.photo{width:100%;aspect-ratio:3/4;border-radius:14px;background:linear-gradient(160deg,#ffd6e8,#cfe9ff);display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.25);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.name{font-size:20px;font-weight:800;margin:10px 0 2px}
.catch{font-size:12px;opacity:.75;margin-bottom:10px}
.prize{border-radius:12px;padding:10px;font-weight:800;font-size:18px;background:#fff;color:#1f6fb8}
.card.gold .prize{color:#b36b00}
.code{margin-top:8px;font-size:12px;letter-spacing:.12em;color:#444}
.note{font-size:12px;margin-top:14px;line-height:1.7;color:var(--ink)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;opacity:.9;z-index:5;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:flash .8s}
@keyframes flash{0%{opacity:0}20%{opacity:.9}100%{opacity:0}}
.demo{position:fixed;top:8px;right:8px;background:#ff5c5c;color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;z-index:9}
/* ===== 当たり専用演出 ===== */
.stage{z-index:2}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;transition:opacity .6s;pointer-events:none;z-index:1}
.dim.on{opacity:1}
.rays{position:fixed;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,216,107,0) 0 10deg,rgba(255,216,107,.38) 10deg 20deg);
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%);mask-image:radial-gradient(circle,#000 0,transparent 60%);
  opacity:0;transition:opacity .8s;pointer-events:none;z-index:1;animation:spin 8s linear infinite}
.rays.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.capsule.gold .top{background:linear-gradient(160deg,#fff3b0,#ffc531)}
.capsule.gold .bot{background:linear-gradient(160deg,#ffe58a,#e8a100)}
.capsule.glow{filter:drop-shadow(0 0 26px #ffd86b)}
.shake-hard{animation:shakeHard .12s infinite}
@keyframes shakeHard{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-6px,3px) rotate(-8deg)}50%{transform:translate(5px,-4px) rotate(7deg)}75%{transform:translate(-4px,-3px) rotate(-5deg)}}
.note{position:relative;z-index:3;background:rgba(255,255,255,.82);border-radius:12px;padding:8px 14px}
.note:empty{display:none}
.banner{position:fixed;left:0;right:0;top:5%;text-align:center;font-size:44px;font-weight:900;letter-spacing:.1em;color:#fff3b0;
  text-shadow:0 0 12px #ff9d00,0 0 30px #ff7a00,0 3px 0 #b36b00;opacity:0;transform:scale(.3);pointer-events:none;z-index:6}
.banner.show{animation:pop 1.2s forwards}
.banner.flow{position:relative;left:auto;right:auto;top:auto;margin:4px 0 12px;z-index:3}
.banner.rb{font-size:46px;color:#fff;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 3px 0 rgba(60,20,90,.75))}
.banner.rb span{-webkit-text-stroke:2.5px #fff;paint-order:stroke fill}
.banner.rb.show{animation:pop 1.2s forwards,rbhue 2.6s linear 1.2s infinite}
@keyframes rbhue{from{filter:hue-rotate(0) drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 3px 0 rgba(60,20,90,.75))}to{filter:hue-rotate(360deg) drop-shadow(0 0 6px rgba(255,255,255,.9)) drop-shadow(0 3px 0 rgba(60,20,90,.75))}}
.banner.soft{font-size:32px;color:#fff;text-shadow:0 3px 0 #2f7fc4,0 0 12px #6fc3ff,0 0 4px #2f7fc4,2px 0 0 #2f7fc4,-2px 0 0 #2f7fc4}
@keyframes pop{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.25)}50%{transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.demoTools{display:flex;gap:10px;margin-top:12px;position:relative;z-index:3}
.demoTools button{border:2px solid #3f9be0;background:#fff;color:#1f6fb8;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}
.demoTools button:active{transform:translateY(2px)}
.winwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.card.gold.winimg{width:min(320px,86vw);padding:0;background:#fff;border-radius:16px;line-height:0}
.winimg img{width:100%;display:block}
.winfoot{opacity:0;animation:fadeUp .6s .9s forwards;background:#fff;border-radius:14px;padding:8px 20px;color:#b36b00;font-weight:800;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.25);line-height:1.5}
.winfoot small{display:block;color:#444;font-size:12px;font-weight:600;letter-spacing:.12em}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* ===== ガチャポンのマシン ===== */
#machine{width:240px;height:320px;display:block;transition:opacity .5s,transform .5s;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
#machine.out{opacity:0;transform:scale(.9) translateY(20px)}
#machine.running{animation:mshake .22s linear infinite}
@keyframes mshake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px)}}
#machine.running .crank-rot{animation:crank .8s linear infinite}
@keyframes crank{to{transform:rotate(360deg)}}
.mini-in{transform-box:fill-box;transform-origin:center}
#machine.running .mini-in{animation:tumble var(--dur,.6s) ease-in-out var(--del,0s) infinite alternate}
@keyframes tumble{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--tx,8px),var(--ty,-10px)) rotate(var(--rot,60deg))}}
.capsule.hidden{display:none}
.capsule.fromMachine{position:absolute;left:50%;top:50%;margin:-95px 0 0 -75px}
.pop{position:fixed;transform:translate(-50%,-50%);white-space:nowrap;font-size:28px;font-weight:900;color:#fff;text-shadow:0 3px 0 #2f7fc4,0 0 10px #6fc3ff,2px 0 0 #2f7fc4,-2px 0 0 #2f7fc4;pointer-events:none;z-index:8;animation:popt .9s ease-out forwards}
@keyframes popt{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(6deg)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
/* ===== さらに派手に ===== */
.spark{position:fixed;pointer-events:none;z-index:7;line-height:1;text-shadow:0 0 8px currentColor}
.orb{position:fixed;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 14px 4px #ffd86b;pointer-events:none;z-index:3}
.ring{position:fixed;width:80px;height:80px;border:5px solid #fff;border-radius:50%;pointer-events:none;z-index:6;box-shadow:0 0 20px currentColor}
.rays.rainbow{animation:spin 8s linear infinite,hue 2.4s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.beat{animation:beat .9s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.2)}30%{transform:scale(1)}45%{transform:scale(1.13)}60%{transform:scale(1)}}
.flash.quick{animation:flashq .25s}
@keyframes flashq{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
.omen{position:fixed;left:0;right:0;top:20%;text-align:center;font-size:64px;font-weight:900;color:#fff;text-shadow:0 0 14px #ffd86b,0 0 36px #ff7a00;opacity:0;pointer-events:none;z-index:6}
.omen.hit{animation:omenHit .5s ease-out forwards}
@keyframes omenHit{0%{opacity:0;transform:scale(2.6)}40%{opacity:1;transform:scale(1)}100%{opacity:1;transform:scale(1)}}
.banner span{display:inline-block;animation:letter .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes letter{0%{opacity:0;transform:translateY(-70px) scale(2.2) rotate(-20deg)}100%{opacity:1;transform:none}}
.card.gold{position:relative;overflow:hidden;animation:rainbowGlow 2.4s linear infinite}
.card.gold::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:sweep 2s ease-in-out infinite;pointer-events:none}
@keyframes sweep{0%{left:-60%}60%,100%{left:130%}}
@keyframes rainbowGlow{
  0%,100%{box-shadow:0 0 40px #ffd86b,0 0 90px #ff9d00,0 14px 40px rgba(0,0,0,.5)}
  25%{box-shadow:0 0 40px #ff7eb6,0 0 90px #ff4f9a,0 14px 40px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 40px #7fd4ff,0 0 90px #3a9bff,0 14px 40px rgba(0,0,0,.5)}
  75%{box-shadow:0 0 40px #b388ff,0 0 90px #7c4dff,0 14px 40px rgba(0,0,0,.5)}}

[hidden]{display:none!important}   /* デモ用ボタンを本番で隠す（display指定に負けないように） */
/* ===== スタンプ・カード番号 ===== */
.stamps{display:inline-flex;gap:5px;justify-content:center;flex-wrap:wrap;max-width:300px;background:rgba(255,255,255,.88);border-radius:14px;padding:8px 12px}
.stamps i{width:22px;height:22px;border-radius:50%;border:2px solid #7fbbea;background:#fff;display:inline-block;font-style:normal;font-size:12px;line-height:18px;text-align:center;color:#fff;transition:background .4s,transform .4s}
.stamps i.on{background:#ffb81f;border-color:#e08b00;transform:scale(1.05)}
.stamps i.on::after{content:'★'}
.stampcap{font-size:12px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.88);border-radius:10px;padding:3px 10px;margin-top:6px;display:inline-block}
#stampbar{margin:10px 0 2px;min-height:0;position:relative;z-index:3}
#stampbar:empty{display:none}
.cardno{font-size:11px;letter-spacing:.14em;font-weight:800;color:#1f6fb8;margin-bottom:6px}
.card.imgcard{width:min(300px,82vw);padding:0;background:#fff;border-radius:16px;line-height:0;overflow:hidden}
.card.imgcard img{width:100%;display:block}
.reward{margin:10px auto 0;max-width:300px;background:linear-gradient(135deg,#fff6c9,#ffd86b 60%,#f0a92c);border-radius:14px;padding:10px 16px;font-weight:800;color:#8a4b00;font-size:15px;line-height:1.5;box-shadow:0 0 22px rgba(255,216,107,.9);animation:fadeUp .6s .4s both}
.reward small{display:block;font-size:12px;font-weight:700;color:#5a3a00;letter-spacing:.1em}
/* ===== 5段階レア度 ===== */
.demoTools{flex-wrap:wrap;justify-content:center}
.demoTools button.tier{padding:7px 12px;font-size:12px;flex:0 0 auto}
.card.t-SR{background:linear-gradient(160deg,#ffffff,#d6ecff 50%,#9fd0ff);box-shadow:0 0 26px rgba(111,195,255,.95),0 14px 40px rgba(0,0,0,.5)}
.card.t-UR{background:linear-gradient(135deg,#ffe3f3,#d9ccff 35%,#c3f1ff 65%,#fff3b0);box-shadow:0 0 40px rgba(255,126,182,.9),0 0 64px rgba(124,212,255,.75),0 14px 40px rgba(0,0,0,.5)}
.card.t-UR .prize{color:#a1326b}
.card.imgcard.t-SR{box-shadow:0 0 28px rgba(111,195,255,.95),0 14px 40px rgba(0,0,0,.5)}
.card.imgcard.t-SSR{box-shadow:0 0 36px rgba(255,216,107,.95),0 14px 40px rgba(0,0,0,.5)}
.card.imgcard.t-UR{box-shadow:0 0 44px rgba(255,126,182,.95),0 0 70px rgba(124,212,255,.8),0 14px 40px rgba(0,0,0,.5)}
.capsule.glowblue{filter:drop-shadow(0 0 22px #6fc3ff)}
.cardno .stars{letter-spacing:.05em;color:#e08b00;margin-left:6px}
.banner.ur{color:#fff;text-shadow:0 0 14px #ff7eb6,0 0 34px #7fd4ff,0 3px 0 #8a2d86;font-size:46px}
.rbadge{display:inline-block;font-weight:900;font-size:12px;padding:1px 8px;border-radius:8px;color:#fff;background:#5aa7e6;margin-right:6px;letter-spacing:.08em}
.rbadge.SR{background:#2f8fe0}.rbadge.SSR{background:#e0a020}.rbadge.UR{background:linear-gradient(90deg,#ff7eb6,#7fb6ff)}.rbadge.SSSR{background:linear-gradient(90deg,#ffb81f,#ff4f8b,#7a5cff)}

/* ============ 魔法×ガチャ（マギレコ風）============ */
:root{--ink:#f5ecff;--gold:#ffd86b;--rose:#ff7eb6}
html,body{background:#0d0a26!important;color:var(--ink)}
body{background:radial-gradient(120% 80% at 50% 0%,#3b2378 0%,#1b1245 45%,#0b0822 100%)!important;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;transition:background 1s}
body.abyss{background:radial-gradient(120% 90% at 50% 40%,#2b0a4a 0%,#0a0418 55%,#000 100%)!important}
#bgstars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgstars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px #cfe;animation:tw 2.2s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15}to{opacity:1}}
#app{z-index:2;padding-top:clamp(22px,4vh,40px)}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:26px;letter-spacing:.14em;margin:0 0 6px;color:transparent;background:linear-gradient(180deg,#fff7d1,#ffd86b 55%,#c98a1a);-webkit-background-clip:text;background-clip:text;text-shadow:none;filter:drop-shadow(0 2px 8px rgba(255,126,182,.55))}
.sub{color:#e9d9ff;text-shadow:0 0 8px rgba(160,100,255,.8);font-size:13px;margin-bottom:10px}
.titleplate{display:inline-block;position:relative;padding:6px 26px;margin-bottom:4px}
.titleplate::before,.titleplate::after{content:'◆';position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);font-size:12px}
.titleplate::before{left:0}.titleplate::after{right:0}
#stage{position:relative;width:min(360px,94vw);min-height:380px;max-width:none;display:block}
#ritual{position:absolute;left:50%;top:0;width:min(380px,100vw);height:min(380px,100vw);margin-left:calc(min(380px,100vw) / -2);transition:opacity .6s,transform .6s}
#ritual.gone{opacity:0;transform:scale(1.6);pointer-events:none}
#ritual svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 14px var(--g))}
#ritual{--c:#9fd8ff;--g:rgba(120,190,255,.85)}
#ritual[data-tone=SR]{--c:#ff9bd6;--g:rgba(255,126,182,.9)}
#ritual[data-tone=SSR]{--c:#ffd86b;--g:rgba(255,200,80,.95)}
#ritual[data-tone=UR] svg,#ritual[data-tone=SSSR] svg{animation:hue 2.2s linear infinite}
#ritual[data-tone=UR]{--c:#ffffff;--g:rgba(255,160,255,.95)}
#ritual[data-tone=SSSR]{--c:#ffffff;--g:rgba(255,230,140,1)}
.mc *{fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .6s}
.mc .thin{stroke-width:.8;opacity:.8}.mc .fillc{fill:var(--c);stroke:none;opacity:.85}
.mc g.sp{transform-box:fill-box;transform-origin:center}
.mc .orbbody{fill:url(#orbg);stroke:var(--c);stroke-width:2}
#orb{transform-box:fill-box;transform-origin:center;animation:orbp 1.6s ease-in-out infinite}
@keyframes orbp{50%{transform:scale(1.25)}}
#pillar{position:absolute;left:50%;bottom:50%;width:90px;height:150vh;margin-left:-45px;transform-origin:50% 100%;transform:scaleY(0);opacity:0;pointer-events:none;z-index:3;
  background:linear-gradient(0deg,rgba(255,255,255,.95),rgba(255,236,170,.6) 40%,rgba(255,200,255,0));filter:blur(2px)}
#pillar.go{animation:pil .9s ease-out forwards}
@keyframes pil{0%{transform:scaleY(0);opacity:1}40%{transform:scaleY(1) scaleX(1);opacity:1}100%{transform:scaleY(1) scaleX(3.5);opacity:0}}

.chappy.cheer{animation:chcheer .5s ease-in-out infinite alternate}
@keyframes chcheer{to{transform:translateY(-9px) rotate(-6deg)}}
.bubble{position:relative;flex:1;min-height:74px;padding:8px 12px 10px;border-radius:14px;background:linear-gradient(180deg,rgba(60,35,120,.92),rgba(30,18,78,.94));border:2px solid var(--gold);box-shadow:0 0 14px rgba(160,100,255,.55),inset 0 0 12px rgba(255,255,255,.08)}
.bubble::before{content:'';position:absolute;left:-10px;top:26px;border:8px solid transparent;border-right-color:var(--gold);border-left:0}
.bubble .nm{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;color:#3a1d00;background:linear-gradient(90deg,#ffe9a3,#ffc531);padding:1px 10px;border-radius:999px;margin-bottom:3px}
.bubble .tx{font-size:14px;font-weight:700;line-height:1.55;min-height:44px}
/* ボタン・スタンプ */
button.main{color:#fff;font-size:19px;letter-spacing:.18em;background:linear-gradient(180deg,#ff8ccf,#d93a9a 60%,#a21f78);border:2px solid var(--gold);box-shadow:0 5px 0 #6b1550,0 0 22px rgba(255,126,182,.8);text-shadow:0 2px 0 rgba(90,10,60,.6)}
button.main:active{box-shadow:0 1px 0 #6b1550,0 0 22px rgba(255,126,182,.8)}
.stamps{background:rgba(25,14,70,.75);border:1.5px solid rgba(255,216,107,.7);box-shadow:0 0 12px rgba(160,100,255,.5)}
.stamps i{width:20px;height:20px;border-radius:4px;transform:rotate(45deg) scale(.82);border:2px solid #9a78e0;background:rgba(255,255,255,.08)}
.stamps i.on{background:linear-gradient(135deg,#fff2a8,#ff8ccf);border-color:var(--gold);transform:rotate(45deg) scale(.95);box-shadow:0 0 10px #ff9bd6}
.stamps i.on::after{content:''}
.stampcap{background:rgba(25,14,70,.75);color:#ffeaa8;border:1px solid rgba(255,216,107,.6)}
.msg{color:#e9d9ff}.note{background:rgba(25,14,70,.78);color:#e9d9ff;border:1px solid rgba(255,216,107,.5)}
.demoTools button{background:rgba(25,14,70,.85);color:#ffeaa8;border-color:var(--gold)}
.reward{background:linear-gradient(135deg,#fff6c9,#ffd86b 60%,#f0a92c)}
/* 結果カード（金縁の魔法カード）*/
.mcard{position:relative;width:min(300px,82vw);margin:0 auto;padding:10px 10px 12px;border-radius:16px;color:#fff;text-align:center;
  background:linear-gradient(170deg,#4a2a96,#26145f 55%,#150a3b);border:3px solid var(--gold);box-shadow:0 0 0 2px #7a4cc0,0 0 28px var(--ca,#b58cff),0 14px 36px rgba(0,0,0,.6);
  opacity:0;transform:translateY(40px) scale(.3) rotateY(540deg);transition:transform .9s cubic-bezier(.2,1.1,.3,1),opacity .4s}
.mcard.show{opacity:1;transform:none}
.mcard::before,.mcard::after{content:'✦';position:absolute;color:var(--gold);font-size:16px;text-shadow:0 0 8px #fff}
.mcard::before{left:6px;top:4px}.mcard::after{right:6px;top:4px}
.mcard.t-R{--ca:#8fd3ff}.mcard.t-SR{--ca:#ff8ccf}.mcard.t-SSR{--ca:#ffd86b}
.mcard.t-UR,.mcard.t-SSSR{--ca:#fff;animation:mcrb 2.4s linear infinite}
@keyframes mcrb{0%,100%{box-shadow:0 0 0 2px #7a4cc0,0 0 34px #ff7eb6,0 0 70px #ffd86b,0 14px 36px rgba(0,0,0,.6)}33%{box-shadow:0 0 0 2px #7a4cc0,0 0 34px #7dff9e,0 0 70px #6fc3ff,0 14px 36px rgba(0,0,0,.6)}66%{box-shadow:0 0 0 2px #7a4cc0,0 0 34px #b388ff,0 0 70px #ff7eb6,0 14px 36px rgba(0,0,0,.6)}}
.mc-top{display:flex;justify-content:space-between;align-items:center;padding:0 18px 4px;font-size:11px;letter-spacing:.14em;font-weight:800;color:#e9d9ff}
.mc-rar{font-size:15px;font-weight:900;color:#3a1d00;padding:0 10px;border-radius:999px;background:linear-gradient(180deg,#fff2a8,#ffc531)}
.mc-stars{font-size:20px;letter-spacing:.12em;color:#ffe066;text-shadow:0 0 8px #ffb81f;margin-bottom:6px;min-height:26px}
.mc-stars .st{display:inline-block;opacity:0;transform:scale(3) rotate(-60deg)}
.mc-stars .st.on{animation:starin .45s cubic-bezier(.2,1.6,.4,1) forwards}
.mc-stars .off{color:rgba(255,255,255,.18);text-shadow:none}
@keyframes starin{to{opacity:1;transform:none}}
.mc-art{border-radius:10px;overflow:hidden;border:2px solid rgba(255,216,107,.85);background:linear-gradient(160deg,#ffd6e8,#cfe9ff);aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;line-height:0}
.mc-art.win{aspect-ratio:auto}
.mc-art img{width:100%;height:100%;object-fit:cover;display:block}.mc-art.win img{height:auto}
.mc-ph{font-size:64px;color:#fff;line-height:1}
.mc-name{margin:9px 0 6px;font-size:19px;font-weight:900;letter-spacing:.08em;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.mc-prize{position:relative;padding:9px 8px;border-radius:8px;font-size:18px;font-weight:900;color:#3a1d00;background:linear-gradient(180deg,#fff7c9,#ffd86b 55%,#f0a92c);box-shadow:0 0 12px rgba(255,216,107,.8)}
.mc-code{margin-top:8px;font-size:12px;letter-spacing:.12em;color:#ffeaa8}
body.abyss .banner{color:#fff}


#blackout{position:fixed;inset:0;z-index:20;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;display:flex;align-items:center;justify-content:center}
#blackout.on{opacity:1;pointer-events:auto}
.bo-txt{text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:900;line-height:1.7;padding:0 16px}
.bo-txt span{display:block;font-size:clamp(24px,7.4vw,34px);letter-spacing:.14em;opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px);color:#fff;
  text-shadow:0 0 10px #ff9bd6,0 0 26px #ff7eb6,0 0 48px #b388ff}
.bo-txt span.in{animation:boin 1.1s ease-out forwards}
.bo-txt span:last-child{background:linear-gradient(180deg,#fff,#ffd0ee 50%,#ffb81f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:blur(6px) drop-shadow(0 0 14px #ff7eb6)}
.bo-txt span:last-child.in{animation:boin2 1.1s ease-out forwards}
@keyframes boin{to{opacity:1;transform:none;filter:blur(0)}}
@keyframes boin2{to{opacity:1;transform:none;filter:blur(0) drop-shadow(0 0 14px #ff7eb6)}}

/* ===== UR：チャッピー変身 ===== */
#henshin{position:fixed;inset:0;z-index:15;display:none;overflow:hidden}
#henshin.on{display:block}
.hs-bg{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.95) 0,rgba(255,150,230,.6) 20%,rgba(70,25,150,.94) 58%,#0a0420 100%)}
#henshin.on .hs-bg{animation:hsbg .5s forwards}
@keyframes hsbg{to{opacity:1}}
.hs-rays{position:absolute;left:50%;top:55%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;opacity:0;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.85) 0 2deg,rgba(255,255,255,0) 2deg 8deg);
  -webkit-mask-image:radial-gradient(circle,transparent 6%,#000 36%);mask-image:radial-gradient(circle,transparent 6%,#000 36%);animation:spin 8s linear infinite;will-change:transform}

#hsChappy.sil{filter:brightness(0) invert(1)}
.wings #hsChappy{animation:hsin .01s forwards,chbob 1.6s ease-in-out infinite!important}
.aura{position:absolute;width:270px;height:270px;margin:-135px 0 0 -135px;border-radius:50%;opacity:0;
  background:conic-gradient(#ff4d6d,#ffb84d,#fff07a,#7dff9e,#4fc3ff,#b388ff,#ff4d6d);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 64%,#000 70%,transparent 72%);mask:radial-gradient(circle,transparent 62%,#000 64%,#000 70%,transparent 72%);animation:spin 2s linear infinite;filter:drop-shadow(0 0 10px #fff)}
.wings .aura{opacity:1;transition:opacity .4s}
.wingbox{position:absolute;top:-112px;width:170px;height:210px}
.wingbox.l{right:62px}.wingbox.r{left:62px;transform:scaleX(-1)}
.wing{width:100%;height:100%;overflow:visible;opacity:0;transform-origin:100% 50%;filter:drop-shadow(0 0 10px #fff)}
.wings .wing{animation:wingopen .9s cubic-bezier(.2,1.4,.4,1) forwards,flap 1.1s ease-in-out .9s infinite alternate}
@keyframes wingopen{from{opacity:0;transform:scaleX(0) rotate(-25deg)}to{opacity:1;transform:scaleX(1) rotate(0)}}
@keyframes flap{to{transform:scaleX(.88) rotate(6deg)}}
.halo{position:absolute;left:-62px;top:-168px;width:124px;height:34px;border-radius:50%;border:7px solid #ffe066;opacity:0;transform:translateY(-140px) scale(.4);
  box-shadow:0 0 18px #ffd86b,inset 0 0 10px #fff}
.wings .halo{animation:halodrop .7s .15s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes halodrop{to{opacity:1;transform:none}}
.hs-title{position:absolute;left:0;right:0;top:5%;text-align:center;display:flex;justify-content:center;white-space:nowrap;transform:rotate(-5deg);
  font-weight:900;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;filter:drop-shadow(0 0 14px #fff) drop-shadow(0 6px 0 rgba(30,0,60,.6))}
.hs-title .ch{position:relative;display:inline-block;font-size:var(--fs);opacity:0;animation:slamh .5s cubic-bezier(.2,1.5,.4,1) forwards}
.hs-title .ch::before{content:attr(data-c);position:absolute;left:0;top:0;color:#2a0a4a;-webkit-text-stroke:.3em #2a0a4a}
.hs-title .ch .f{position:relative;z-index:1;display:inline-block;color:transparent;background:linear-gradient(180deg,#ff4d6d 0%,#ffb84d 22%,#fff07a 40%,#7dff9e 58%,#4fc3ff 78%,#b388ff 100%);-webkit-background-clip:text;background-clip:text}
@keyframes slamh{0%{opacity:0;transform:scale(4.5) rotate(-25deg)}60%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}

#hsGod{position:absolute;left:0;top:0;width:min(86vw,400px,52vh);height:min(86vw,400px,52vh);margin:calc(min(86vw,400px,52vh) / -2) 0 0 calc(min(86vw,400px,52vh) / -2);border-radius:18px;overflow:hidden;
  border:4px solid #ffe066;opacity:0;transform:scale(.2) rotate(-8deg);box-shadow:0 0 30px #fff,0 0 70px #ffd86b,0 0 120px #ff7eb6}
#hsGod img{width:100%;height:100%;display:block;object-fit:cover}
#hsGod::after{content:'';position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-18deg);animation:sweep 2.2s ease-in-out .9s infinite}
.wings #hsGod{animation:godin .9s cubic-bezier(.2,1.4,.4,1) forwards,godrb 2.4s linear .9s infinite}
@keyframes godin{to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes godrb{0%,100%{box-shadow:0 0 30px #fff,0 0 70px #ffd86b,0 0 120px #ff7eb6}33%{box-shadow:0 0 30px #fff,0 0 70px #7dff9e,0 0 120px #6fc3ff}66%{box-shadow:0 0 30px #fff,0 0 70px #b388ff,0 0 120px #ff7eb6}}
.wings #hsChappy{display:none}
.aura{width:min(112vw,480px)!important;height:min(112vw,480px)!important;margin:calc(min(112vw,480px) / -2) 0 0 calc(min(112vw,480px) / -2)!important;border-radius:50%}

#crack{position:fixed;inset:0;z-index:16;display:none;pointer-events:none}
#crack.on{display:block}
#crackSvg{position:absolute;inset:0;width:100%;height:100%}
.cr.glow{stroke:rgba(150,200,255,.35)!important}
.cr{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:crdraw .35s ease-out forwards}
@keyframes crdraw{to{stroke-dashoffset:0}}
#crackTxt{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%) scale(1);text-align:center;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-weight:900;
  font-size:clamp(40px,12.5vw,60px);letter-spacing:.12em;color:#fff;opacity:0;text-shadow:0 0 14px #ff2d6f,0 3px 0 #3a0014;will-change:transform,opacity}
#crackTxt.in{animation:crtx 2.4s ease-out forwards}
@keyframes crtx{0%{opacity:0;transform:translateY(-50%) scale(3.2)}14%{opacity:1;transform:translateY(-50%) scale(.94)}22%{transform:translateY(-50%) scale(1.04)}30%,100%{opacity:1;transform:translateY(-50%) scale(1)}}
</style>

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let ticket = params.get('t') || (location.hash.match(/t=([A-Z2-9]+)/) || [])[1] || '';
const demo = !CONFIG.GAS_URL;
let auth = { userId: 'demo', idToken: '' };
let forceTier = ''; // デモ用: レア度ボタンで、そのレア度の演出を確認する
async function init() {
  if (demo) {
    $('demoBadge').hidden = false; $('demoTools').hidden = false;
    document.querySelectorAll('.tier').forEach(b => b.onclick = () => { if ($('btn').disabled || $('btn').style.display === 'none') return; forceTier = b.dataset.t; $('btn').click(); });
    $('btnReset').onclick = () => location.reload();
    $('btnStamp').onclick = () => { demoCount(9); renderStamps({ count: 9, goal: 10 }, true); };
    renderStamps({ count: demoCount(), goal: 10 }, true);
    $('note').textContent = 'これはデモです。本番ではサーバーが抽選し、1チケットにつき1回のみ引けます。?win=1 を付けると当選演出を確認できます。';
    return;
  }
  try {
    if (CONFIG.LIFF_ID) {
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      auth.idToken = liff.getIDToken();
      const q = liff.getContext && liff.getContext();
      // LIFFはチケットを liff.state 経由で渡すことがあるため再取得
      const st = new URLSearchParams((new URL(location.href)).searchParams.get('liff.state') || '');
      if (!ticket) ticket = new URLSearchParams(location.search).get('t') || st.get('t') || '';
    }
  } catch (e) { showErr('LINEの確認に失敗しました。LINEアプリから開き直してください'); }
  if (!ticket) { showErr('チケットが見つかりません。スタッフにお声がけください'); $('btn').disabled = true; return; }
  try {
    const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'info', idToken: auth.idToken, userId: auth.userId }) });
    const j = await res.json();
    if (j.ok) { applyUi(j.ui); renderStamps(j.stamp, true); }
  } catch (e) { /* 表示だけなので失敗しても進める */ }
}

function applyUi(ui) {
  if (!ui) return;
  if (ui.title) { document.querySelector('h1').textContent = ui.title; document.title = ui.title; }
  if (ui.guide) document.querySelector('.sub').textContent = ui.guide;
}

// スタンプ表示。pre=true は引く前（今のたまり具合）、false は引いた後
function renderStamps(st, pre) {
  const el = $('stampbar');
  if (!st || !st.goal) { el.innerHTML = ''; return; }
  const filled = pre ? st.count % st.goal : st.filled;
  let dots = '';
  for (let i = 0; i < st.goal; i++) dots += `<i class="${i < filled ? 'on' : ''}"></i>`;
  const left = st.goal - filled;
  const cap = (!pre && filled >= st.goal) ? '🎉 スタンプがたまりました！' : (pre ? `あと${left}回引くと無料券がもらえます` : `あと${left}回で無料券！`);
  el.innerHTML = `<div class="stamps">${dots}</div><div><span class="stampcap">${cap}（${filled}/${st.goal}）</span></div>`;
}

// デモ用: 引いた回数をブラウザに保存（本番はサーバーがLINEユーザーごとに数える）
function demoCount(set) {
  try {
    if (set !== undefined) localStorage.setItem('sorairo_demo_count', String(set));
    return Number(localStorage.getItem('sorairo_demo_count') || 0);
  } catch (e) { return window.__dc = (set !== undefined ? set : (window.__dc || 0)); }
}

function showErr(t) { $('msg').className = 'msg err'; $('msg').textContent = t; }

function confetti(n) {
  const colors = ['#ffd86b', '#ff9ec4', '#6fc3ff', '#8be8b0'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
    c.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5500);
  }
}

function esc(s) { return String(s || '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m])); }

const rnd = (a, b) => a + Math.random() * (b - a);
function stageCenter() { const r = $('stage').getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
function burst(x, y, n, o) {
  o = o || {};
  const colors = o.colors || ['#ffd86b', '#ff9ec4', '#6fc3ff', '#8be8b0', '#b9a6ff'];
  const glyphs = o.glyphs || ['★', '✦', '🌼', '✶', '●'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div');
    s.className = 'spark'; s.textContent = glyphs[i % glyphs.length];
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.color = colors[i % colors.length]; s.style.fontSize = rnd(10, 26) + 'px';
    document.body.appendChild(s);
    const a = rnd(0, Math.PI * 2), d = (o.dist || 240) * rnd(.35, 1.1);
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d + (o.gravity === undefined ? 50 : o.gravity);
    s.animate([
      { transform: 'translate(-50%,-50%) scale(.2) rotate(0deg)', opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1.3) rotate(${rnd(-360, 360)}deg)`, opacity: 0 }
    ], { duration: rnd(800, 1700), easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards' }).onfinish = () => s.remove();
  }
}
function ring(x, y, color, size) {
  const r = document.createElement('div'); r.className = 'ring';
  r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.borderColor = color || '#fff'; r.style.color = color || '#fff';
  document.body.appendChild(r);
  r.animate([{ transform: 'translate(-50%,-50%) scale(.1)', opacity: 1 }, { transform: `translate(-50%,-50%) scale(${size || 14})`, opacity: 0 }],
    { duration: 900, easing: 'ease-out', fill: 'forwards' }).onfinish = () => r.remove();
}
function shakeScreen(ms, amp) {
  const f = []; for (let i = 0; i < 14; i++) f.push({ transform: `translate(${rnd(-amp, amp)}px,${rnd(-amp, amp)}px)` });
  f.push({ transform: 'translate(0,0)' });
  $('app').animate(f, { duration: ms, easing: 'linear' });
}
function flashQ() { const f = $('flash'); f.classList.remove('quick'); void f.offsetWidth; f.classList.add('quick'); }
function converge(ms) {
  const [cx, cy] = stageCenter(); const t0 = Date.now();
  const id = setInterval(() => {
    if (Date.now() - t0 > ms) { clearInterval(id); return; }
    for (let k = 0; k < 3; k++) {
      const a = rnd(0, Math.PI * 2), d = rnd(180, Math.max(innerWidth, innerHeight) * .6);
      const p = document.createElement('div'); p.className = 'orb';
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      document.body.appendChild(p);
      p.animate([
        { transform: `translate(calc(-50% + ${Math.cos(a) * d}px),calc(-50% + ${Math.sin(a) * d}px)) scale(.4)`, opacity: 0 },
        { opacity: 1, offset: .3 },
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 0 }
      ], { duration: rnd(700, 1100), easing: 'ease-in', fill: 'forwards' }).onfinish = () => p.remove();
    }
  }, 70);
}
function sparkleCard(ms) {
  const t0 = Date.now();
  const id = setInterval(() => {
    const c = $('card'); if (!c || Date.now() - t0 > ms) { clearInterval(id); return; }
    const r = c.getBoundingClientRect();
    burst(r.left + rnd(0, r.width), r.top + rnd(0, r.height), 2, { dist: 50, gravity: -30, glyphs: ['✦', '✧'] });
  }, 110);
}
function fireworks(ms) {
  const t0 = Date.now();
  const id = setInterval(() => {
    if (Date.now() - t0 > ms) { clearInterval(id); return; }
    const x = rnd(innerWidth * .1, innerWidth * .9), y = rnd(innerHeight * .12, innerHeight * .55);
    const col = ['#ffd86b', '#ff7eb6', '#7fd4ff', '#b388ff', '#7dffb0'][Math.floor(rnd(0, 5))];
    burst(x, y, 22, { colors: [col, '#fff'], glyphs: ['●', '✦'], dist: 120, gravity: 60 });
    ring(x, y, col, 5);
  }, 420);
}
function setBanner(text, soft, rainbow) {
  const b = $('banner'); b.className = 'banner flow' + (soft ? ' soft' : '') + (rainbow ? ' rb' : '');
  const cs = $('cardSlot'); if (cs && cs.parentNode && b.nextSibling !== cs) cs.parentNode.insertBefore(b, cs); // カードの上に置く（重ならない）
  const chars = [...text];
  b.innerHTML = chars.map((ch, i) => `<span style="animation-delay:${i * 0.09}s${rainbow ? ';color:hsl(' + Math.round(i * 330 / Math.max(1, chars.length - 1)) + ',100%,62%)' : ''}">${ch === ' ' ? '&nbsp;' : ch}</span>`).join('');
  void b.offsetWidth; b.classList.add('show');
}
function omen(t) { const o = $('omen'); o.textContent = t; o.classList.remove('hit'); void o.offsetWidth; o.classList.add('hit'); }
function openFx(tier) {
  const [cx, cy] = stageCenter();
  if (tier === 'SSSR') { ring(cx, cy, '#ffd86b', 18); ring(cx, cy, '#ffffff', 12); burst(cx, cy, 90, { dist: 360 }); shakeScreen(700, 14); fireworks(3200); }
  else if (tier === 'UR') { ring(cx, cy, '#ff7eb6', 16); ring(cx, cy, '#7fd4ff', 12); burst(cx, cy, 70, { dist: 320 }); shakeScreen(600, 11); fireworks(2400); }
  else if (tier === 'SSR') { ring(cx, cy, '#ffd86b', 14); burst(cx, cy, 52, { dist: 280 }); shakeScreen(450, 8); fireworks(1400); }
  else if (tier === 'SR') { ring(cx, cy, '#6fc3ff', 11); burst(cx, cy, 44, { dist: 240 }); shakeScreen(320, 5); }
  else { ring(cx, cy, '#ff7eb6', 8); burst(cx, cy, 26, { dist: 200 }); shakeScreen(250, 4); }
}

let spinAnims = [], spinTween = 0, spinNow = 1;
function buildCircle() {

    spinAnims.push($(id).animate([{ transform: 'rotate(0)' }, { transform: `rotate(${360 * dir}deg)` }], { duration: d, iterations: Infinity }));

  let st = ''; for (let i = 0; i < 60; i++) st += `<i style="left:${rnd(0, 100).toFixed(1)}%;top:${rnd(0, 100).toFixed(1)}%;animation-delay:${rnd(0, 2).toFixed(2)}s;transform:scale(${rnd(.5, 1.5).toFixed(2)})"></i>`;

function setSpin(to, ms) {
  clearInterval(spinTween); const from = spinNow, t0 = Date.now();
  spinTween = setInterval(() => {
    const k = Math.min(1, (Date.now() - t0) / (ms || 1)); spinNow = from + (to - from) * k;
    spinAnims.forEach(a => a.playbackRate = spinNow); if (k >= 1) clearInterval(spinTween);
  }, 30);
}
function tone(t) { $('ritual').dataset.tone = t; }

/* ---- 結果カード ---- */
function cardImgFail(el) {
  el.onerror = null;
  if (el.dataset.big === '1') { el.src = WIN_IMG; return; }
  const th = ((window.__r || {}).therapist) || {};
  el.parentNode.classList.remove('win'); el.outerHTML = `<div class="mc-ph">${esc((th.name || '？').charAt(0))}</div>`;
}
function renderCard(r) {
  window.__r = r;
  const tier = tierOf(r), T = TIERS[tier], win = tier === 'SSSR', c = r.card || {}, th = r.therapist || {};
  const prizeText = r.prizeLabel || 'ご来店ありがとうございます';
  let stars = ''; for (let i = 0; i < 5; i++) stars += `<span class="st ${i < T.star ? '' : 'off'}" data-i="${i}">★</span>`;
  const art = (win || c.img)
    ? `<div class="mc-art win"><img src="${esc(c.img || WIN_IMG)}" data-big="${win ? 1 : 0}" onerror="cardImgFail(this)" alt=""></div>`
    : `<div class="mc-art">${th.photoUrl ? `<img src="${esc(th.photoUrl)}" alt="">` : `<div class="mc-ph">${esc((th.name || '？').charAt(0))}</div>`}</div>`;
  $('cardSlot').innerHTML = `<div class="mcard t-${tier}" id="card">
    <div class="mc-top"><span>${c.no ? esc(c.no) : ''}</span><span class="mc-rar">${tier}</span></div>
    <div class="mc-stars">${stars}</div>${art}
    ${(win || c.img) ? '' : `<div class="mc-name">${esc(th.name || '')}</div>`}
    <div class="mc-prize" style="margin-top:${(win || c.img) ? 10 : 0}px">${win ? '🎉 ' : ''}${esc(prizeText)}</div>
    ${r.prizeCode ? `<div class="mc-code">引換コード: ${esc(r.prizeCode)}</div>` : ''}
  </div>`;
  $('cardSlot').style.display = 'block'; $('ritual').classList.add('gone');
  document.querySelector('.titleplate').style.display = 'none'; document.querySelector('.sub').style.display = 'none';
  $('stage').style.minHeight = '0'; $('app').style.paddingTop = 'clamp(84px,12vh,110px)';
  window.scrollTo(0, 0); setTimeout(() => window.scrollTo(0, 0), 700);
  requestAnimationFrame(() => setTimeout(() => {
    $('card').classList.add('show');
    document.querySelectorAll('.mc-stars .st:not(.off)').forEach((s, i) => setTimeout(() => { s.classList.add('on'); burst(s.getBoundingClientRect().left + 8, s.getBoundingClientRect().top + 10, 6, { dist: 50, gravity: 0, glyphs: ['✦'], colors: ['#ffe066'] }); }, 700 + i * 220));
    document.querySelectorAll('.mc-stars .st.off').forEach(s => s.classList.add('on'));
  }, 60));
  $('note').textContent = r.prizeCode || r.reward ? ((r.ui && r.ui.redeemNote) || '次回のご来店時、このコードをスタッフにお見せください。') : '';
  renderStamps(r.stamp, false);
  if (r.reward) {
    $('stampbar').insertAdjacentHTML('beforeend', `<div class="reward">🎁 ${esc(r.reward.label)}<small>引換コード: ${esc(r.reward.code)}</small></div>`);
    if (!r.again) setTimeout(() => { confetti(80); burst(innerWidth / 2, innerHeight * .75, 36); }, 1600);
  }
  setBanner(T.banner, T.soft, win); if (T.cls) $('banner').classList.add(T.cls);
  confetti(T.confetti);
  if (tier === 'SSR' || tier === 'UR' || win) { setTimeout(() => confetti(Math.round(T.confetti * .7)), 1200); $('flash').classList.add('go'); }
  if (navigator.vibrate) navigator.vibrate({ R: [60], SR: [100, 40, 100], SSR: [200, 60, 200], UR: [200, 60, 200, 60, 300], SSSR: [200, 80, 200, 80, 400] }[tier]);
  sparkleCard(T.spark);
}


/* ---- UR：チャッピー変身 ---- */
function hsTitle(text) {
  const n = [...text].length, fs = Math.min(60, Math.floor(innerWidth * .84 / (n * 1.06)));
  const t = $('hsTitle'); t.style.setProperty('--fs', fs + 'px');
  t.innerHTML = [...text].map((c, i) => `<span class="ch" data-c="${c}" style="animation-delay:${(i * .06).toFixed(2)}s"><span class="f">${c}</span></span>`).join('');
}
function wingSvg() {
  let f = '<defs><linearGradient id="wgd" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ffd9f0"/><stop offset="1" stop-color="#bfe3ff"/></linearGradient></defs>';
  for (let i = 0; i < 6; i++) {
    const ang = -64 + i * 26, len = 150 - i * 9;
    f += `<g transform="rotate(${ang} 160 105)"><ellipse cx="${160 - len / 2}" cy="105" rx="${len / 2}" ry="${15 - i * .6}" fill="url(#wgd)" stroke="#ffe066" stroke-width="1.6"/></g>`;
  }
  $('wingL').innerHTML = f; $('wingR').innerHTML = f.replace('id="wgd"', 'id="wgd2"').replace(/url\(#wgd\)/g, 'url(#wgd2)');
}
async function henshin(kind) {
  const H = $('henshin'), ch = $('hsChappy'), cx = innerWidth / 2, cy = innerHeight * .55;
  H.className = 'on'; ch.classList.add('sil');
  hsTitle('チャッピー、変身！');
  say('いくワン…！ チャッピー、へんしんだワン！', 22);
  if (navigator.vibrate) navigator.vibrate([100, 60, 100]);
  await sleep(1500);
  if (kind === 'SSSR') { await crackScene(); return; }
  // まぶしい光 → 虹の輪・翼・天使の輪がひらく
  flashQ(); ch.classList.remove('sil'); H.classList.add('wings');
  burst(cx, cy, 70, { dist: 320 }); ring(cx, cy, '#fff', 16); ring(cx, cy, '#ff7eb6', 11); shakeScreen(600, 11);
  if (navigator.vibrate) navigator.vibrate([200, 60, 300]);
  hsTitle('GODチャッピー降臨！');
  say(FINAL ? 'これが、ボクの本当の姿だワン…！！！' : 'まぶしいワン！！ これがGODチャッピーだワン！！', 22);
  const t0 = Date.now(), id = setInterval(() => {
    if (Date.now() - t0 > 2000) { clearInterval(id); return; }
    burst(cx + rnd(-110, 110), cy + rnd(-130, 100), 2, { dist: 70, gravity: -30, glyphs: ['✦', '✧', '★'], colors: ['#ff7eb6', '#7fd4ff', '#ffe066', '#7dff9e', '#b388ff'] });
  }, 90);
  await sleep(2300);
  $('flash').classList.add('go'); await sleep(320);
  H.className = ''; $('hsTitle').innerHTML = ''; $('flash').classList.remove('go');
}


/* ---- SSSR：画面に亀裂 →「今回はわたし」→ ブラックアウト ---- */
async function crackScene() {
  const C = $('crack'), svg = $('crackSvg'), W = innerWidth, Hh = innerHeight, cx = W / 2, cy = Hh * .55;
  svg.setAttribute('viewBox', `0 0 ${W} ${Hh}`); svg.innerHTML = '';
  C.className = 'on'; say('…あれ？ なにかおかしいワン…！？', 24);
  // 中心から枝分かれしながら走る亀裂
  const mk = (x, y, ang, len, w, delay, depth) => {
    let d = `M${x.toFixed(1)} ${y.toFixed(1)}`, px = x, py = y, a = ang, tot = 0;
    while (tot < len) {
      const seg = rnd(26, 60); a += rnd(-.38, .38); px += Math.cos(a) * seg; py += Math.sin(a) * seg; tot += seg;
      d += ` L${px.toFixed(1)} ${py.toFixed(1)}`;
      if (depth < 2 && Math.random() < .2) mk(px, py, a + rnd(-1.1, 1.1), len * .45, w * .6, delay + tot / 1400, depth + 1);
    }
    const mkp = (cls, ww) => {
      const pa = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pa.setAttribute('d', d); pa.setAttribute('pathLength', '1'); pa.setAttribute('class', cls); pa.style.strokeWidth = ww;
      pa.style.animationDelay = delay.toFixed(2) + 's'; svg.appendChild(pa);
    };
    if (depth < 1) mkp('cr glow', w * 4);
    mkp('cr', w);
  };
  for (let i = 0; i < 9; i++) mk(cx + rnd(-8, 8), cy + rnd(-8, 8), i * Math.PI / 4.5 + rnd(-.25, .25), Math.hypot(W, Hh) * rnd(.55, .9), rnd(2.4, 4.2), rnd(0, .25), 0);
  flashQ(); shakeScreen(700, 14); if (navigator.vibrate) navigator.vibrate([250, 50, 250, 50, 400]);
  await sleep(420); flashQ(); shakeScreen(500, 10);
  await sleep(900);
  // 「今回はわたし」
  const T = $('crackTxt'); T.classList.remove('in'); void T.offsetWidth; T.classList.add('in');
  shakeScreen(400, 8); if (navigator.vibrate) navigator.vibrate([400]);
  say('………！！！', 60);
  await sleep(2400);
  // ブラックアウト（亀裂ごと闇に沈む）
  $('blackout').classList.add('on');
  await sleep(850);
  $('henshin').className = ''; $('hsTitle').innerHTML = ''; C.className = ''; T.classList.remove('in');
}

/* ---- 儀式（魔法陣の演出）。レア度が高いほど長く・激しく ---- */
async function ritual(tier, again) {
  const t = again ? 'R' : tier;
  const v = t === 'SSSR' ? 'UR' : t;   // 見た目はSSSRもURと同じ（途中までは見分けがつかない）
  const W = { R: [900, 10], SR: [1400, 15], SSR: [1900, 22], UR: [1300, 30] }[v];
  $('chappy').classList.remove('cheer');
  setSpin(8, 600); await sleep(900);
  if (again) { setSpin(30, 300); await sleep(300); return; }
  tone(v); say(CHAPPY_LINES.omen[v], 22);
  setSpin(W[1], 700);
  const [cx, cy] = stageCenter();
  if (t !== 'R') { flashQ(); if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }
  const t0 = Date.now(), id = setInterval(() => {
    if (t !== 'R') burst(cx + rnd(-120, 120), cy + rnd(-120, 120), 2, { dist: 60, gravity: -20, glyphs: ['✦', '✧'], colors: t === 'UR' || t === 'SSSR' ? ['#ff7eb6', '#7fd4ff', '#ffe066', '#b388ff'] : [tone_color(t)] });
  }, 140);
  if (v === 'UR') shakeScreen(W[0] * .6, 6);
  await sleep(W[0]); clearInterval(id);
  if (t === 'SSSR') {
    // URと同じ変身が始まる → 光る直前に画面に亀裂 →「今回はわたし」→ ブラックアウト → セリフ
    await henshin('SSSR');
    if (navigator.vibrate) navigator.vibrate([300, 80, 300]);
    await sleep(1000);
    const sp = [...document.querySelectorAll('#boTxt span')]; sp.forEach(x => x.classList.remove('in'));
    for (const x of sp) { x.classList.add('in'); await sleep(950); }
    await sleep(1500);
    return;
  }
  if (t === 'UR') { await henshin(); }
  // 魔法陣が一気に加速 → 光の柱
  setSpin(70, 350); await sleep(380);
  $('pillar').classList.remove('go'); void $('pillar').offsetWidth; $('pillar').classList.add('go');
  ring(cx, cy, '#fff', 14); ring(cx, cy, tone_color(t), 10);
  if (t !== 'R') $('flash').classList.add('go');
  await sleep(450);
  openFx(t);
  document.body.classList.remove('abyss');
  $('flash').classList.remove('go');
}
function tone_color(t) { return { R: '#9fd8ff', SR: '#ff9bd6', SSR: '#ffd86b', UR: '#ffffff', SSSR: '#ffffff' }[t]; }

$('btn').addEventListener('click', async () => {
  const btn = $('btn');
  btn.disabled = true; $('msg').className = 'msg'; $('msg').textContent = '';
  say(CHAPPY_LINES.pre, 22);
  let r;
  try { r = await callDraw(); } catch (e) { r = { ok: false, error: 'server_error' }; }
  if (!r.ok) { showErr(ERR[r.error] || 'エラーが発生しました'); btn.disabled = false; setSpin(1, 300); say('ごめんワン…もう一度ためしてほしいワン。'); return; }
  const tier = tierOf(r);
  try { await ritual(tier, !!r.again); } catch (e) { console.error(e); }
  const dark = $('blackout').classList.contains('on');
  ['henshin', 'crack'].forEach(id => { $(id).className = ''; });
  renderCard(r); btn.style.display = 'none';
  if (dark) {
    await sleep(300);
    $('flash').classList.add('go'); $('blackout').classList.remove('on');
    document.querySelectorAll('#boTxt span').forEach(x => x.classList.remove('in'));
    openFx('SSSR'); await sleep(200); $('flash').classList.remove('go');
  }
  $('chappy').classList.add('cheer');
  say(r.again ? CHAPPY_LINES.again : CHAPPY_LINES.done[tier], 24);
  $('msg').textContent = r.again ? '前回の結果を表示しています' : '';
});

buildCircle();
say(CHAPPY_LINES.idle[0], 30);
(function idleTalk() { let i = 0; setInterval(() => { if ($('btn').disabled || $('btn').style.display === 'none') return; i = (i + 1) % CHAPPY_LINES.idle.length; say(CHAPPY_LINES.idle[i], 30); }, 6500); })();
init();
</script>
