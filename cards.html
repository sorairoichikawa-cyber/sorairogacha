<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>マイカード</title>
<style>
:root{--ink:#23496e;--sub:#5d7b99;--line:#d3e5f3;--gold:#ffd86b;--sky:#6fc3ff;--deep:#2f77ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#cfeaff 0%,#e8f5ff 45%,#fbfdff 100%) fixed;color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:520px;margin:0 auto;padding:22px 16px calc(40px + env(safe-area-inset-bottom))}
h1{margin:6px 0 2px;text-align:center;font-size:24px;letter-spacing:.12em;font-weight:800}
.sub{margin:0 0 18px;text-align:center;font-size:13px;color:var(--sub);letter-spacing:.06em}
.count{display:inline-block;margin:0 auto 14px;padding:4px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700}
.center{text-align:center}
.item{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;box-shadow:0 6px 18px rgba(80,130,175,.12)}
.thumb{flex:none;width:92px;height:122px;border-radius:12px;overflow:hidden;background:#e4f0fa;display:grid;place-items:center;position:relative;border:2px solid var(--rc,#8fb8d8)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-size:36px}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rar{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.1em;color:#fff;background:var(--rc,#8fb8d8);border-radius:99px;padding:2px 10px}
.label{font-size:18px;font-weight:800;line-height:1.3}
.exp{font-size:12.5px;color:var(--sub)}
.exp b{color:var(--ink)}
.soon .exp b{color:#d2452f}
.soon .left{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:#ffe9e4;color:#d2452f;font-weight:800;font-size:12px}
.code{margin-top:2px;padding:8px 10px;border-radius:12px;background:#f1f8fe;border:1px dashed #9cc7e8;text-align:center}
.code small{display:block;font-size:10.5px;color:var(--sub);letter-spacing:.1em}
.code span{font-size:20px;font-weight:800;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.note{margin:6px 4px 0;font-size:12.5px;color:var(--sub);line-height:1.7;text-align:center}
.empty{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 20px;text-align:center;line-height:1.8}
.empty b{font-size:17px;display:block;margin-bottom:6px}
.stamp{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.stamp .dots{display:flex;justify-content:center;gap:6px;margin:8px 0 6px;flex-wrap:wrap}
.stamp i{width:20px;height:20px;border-radius:50%;background:#e4f0fa;border:2px solid #cfe2f1}
.stamp i.on{background:linear-gradient(135deg,#ffe38a,#ffb93d);border-color:#f0a21f}
.stamp .cap{font-size:13px;font-weight:700}
.msg{padding:40px 10px;text-align:center;color:var(--sub);line-height:1.8}
.msg.err{color:#c0392b}
.r-R{--rc:#8fb8d8}.r-SR{--rc:#4fa6e8}.r-SSR{--rc:#e0a93a}.r-UR{--rc:#b865e0}.r-SSSR{--rc:#ff7aa8}
.r-SSSR .rar{background:linear-gradient(90deg,#ff7aa8,#ffb93d,#5fc8ff)}
</style>
</head>
<body>
<div id="app">
  <h1>マイカード</h1>
  <p class="sub">いま使える特典</p>
  <div id="main"><div class="msg">読み込み中…</div></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* ===== 設定 ===== */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbx7XF59tIFj4-ZqbJXhEWkgZNy6RxovTpmDeeWwEnTU8mEckwGoc1CwpciFDObK3xWN/exec', // ガチャと同じ裏側のURL
  LIFF_ID: ''   // 「マイカード」用のLIFF ID を入れる（空のままだと、本番では開けません）
};

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = iso => new Date(iso).toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'numeric', day: 'numeric' });

function show(html) { $('main').innerHTML = html; }
function msg(t, err) { show(`<div class="msg${err ? ' err' : ''}">${esc(t)}</div>`); }

function render(data) {
  const items = data.items || [];
  let html = '';
  if (!items.length) {
    html += `<div class="empty"><b>いま使える特典はありません</b>ご来店でもらえるガチャチケットで、<br>特典をゲットしよう！</div>`;
  } else {
    html += `<div class="center"><span class="count">使える特典 ${items.length}枚</span></div>`;
    items.forEach(it => {
      const rar = it.card && it.card.rarity ? it.card.rarity : '';
      const img = it.card && it.card.img
        ? `<img src="${esc(it.card.img)}" alt="" loading="lazy" onerror="this.remove()">`
        : `<span class="ph">${it.stamp ? '🎁' : '🎴'}</span>`;
      const soon = it.daysLeft <= 7 ? ' soon' : '';
      html += `<div class="item r-${esc(rar || 'R')}${soon}">
        <div class="thumb">${img}</div>
        <div class="body">
          ${rar ? `<span class="rar">${esc(rar)}</span>` : (it.stamp ? '<span class="rar">STAMP</span>' : '')}
          <div class="label">${esc(it.label)}</div>
          <div class="exp"><b>${esc(fmtDate(it.expiresAt))}</b> まで${it.daysLeft <= 7 ? `<span class="left">あと${it.daysLeft}日</span>` : `（あと${it.daysLeft}日）`}</div>
          <div class="code"><small>引換コード</small><span>${esc(it.code)}</span></div>
        </div>
      </div>`;
    });
    html += `<p class="note">${esc(data.redeemNote || '次回のご来店時、このコードをスタッフにお見せください。')}</p>`;
  }
  const st = data.stamp;
  if (st && st.goal) {
    const filled = st.count % st.goal;
    let dots = '';
    for (let i = 0; i < st.goal; i++) dots += `<i class="${i < filled ? 'on' : ''}"></i>`;
    html += `<div class="stamp"><div class="cap">スタンプ</div><div class="dots">${dots}</div><div class="cap">あと${st.goal - filled}回で無料券！</div></div>`;
  }
  show(html);
}

async function init() {
  // 見た目の確認用（?demo=1）。本番のデータには触れない
  if (params.get('demo') === '1') {
    const d = n => new Date(Date.now() + n * 864e5).toISOString();
    return render({ items: [
      { code: 'WR6KBAU4KF', label: '100分無料チケット', stamp: false, expiresAt: d(5), daysLeft: 5, card: { no: 'No.01', name: 'SSSR', rarity: 'SSSR', img: '' } },
      { code: 'W3HHH49USR', label: '次回3,000円引き！', stamp: false, expiresAt: d(40), daysLeft: 40, card: { no: 'No.03', name: 'UR-6', rarity: 'UR', img: '' } },
      { code: 'Z9XTA5N4C4', label: '30分無料サービス', stamp: false, expiresAt: d(200), daysLeft: 200, card: { no: 'No.08', name: 'UR-1', rarity: 'UR', img: '' } },
      { code: 'AAAA111122', label: '来店10回 無料券', stamp: true, expiresAt: d(300), daysLeft: 300, card: null }
    ], redeemNote: '次回のご来店時、このコードをスタッフにお見せください。', stamp: { count: 13, goal: 10 } });
  }
  if (!CONFIG.LIFF_ID) return msg('ただいま準備中です', true);
  let idToken = '';
  try {
    await liff.init({ liffId: CONFIG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    idToken = liff.getIDToken();
  } catch (e) { return msg('LINEの確認に失敗しました。LINEアプリから開き直してください', true); }
  try {
    const res = await fetch(CONFIG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'mycards', idToken: idToken }) });
    const j = await res.json();
    if (!j.ok) return msg(j.error === 'line_auth' ? 'LINEの確認に失敗しました。LINEアプリから開き直してください' : '混み合っています。少し待ってもう一度お試しください', true);
    render(j);
  } catch (e) { msg('通信できませんでした。電波を確かめてもう一度お試しください', true); }
}
init();
</script>
</body>
</html>
